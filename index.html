<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#050505" />
    <title>TitanTech — Consola de Operación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Splash instantáneo -->
    <div id="root">
      <div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#050505;color:#f2f2ef;font-family:'Space Mono',monospace">
        <div style="font-weight:700;font-size:20px;letter-spacing:0.22em">TITANTECH</div>
        <div style="font-size:10px;letter-spacing:0.18em;color:#c4c4c4;text-transform:uppercase">consola de operación</div>
        <div style="width:120px;height:3px;background:#1e1e1e;overflow:hidden;margin-top:8px">
          <div style="height:100%;width:40%;background:#a8c7da;animation:ttbar 1.1s ease-in-out infinite alternate"></div>
        </div>
        <style>@keyframes ttbar{from{margin-left:-40%}to{margin-left:100%}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
