server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Seguridad ----
    # Consola de operación: NO indexable (además del robots noindex del HTML)
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # CSP: mitiga XSS; unsafe-inline solo para style (antd inline styles)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- Compresión ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss text/javascript image/svg+xml;

    # ---- API -> backend (Gunicorn :8000). Preserva el prefijo /api/. ----
    # 'resolver' + variable fuerzan a nginx a re-resolver 'back' en cada petición,
    # así sobrevive a recreaciones del contenedor back (IP cambia).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_back http://back:8000;
    location /api/ {
        proxy_pass $upstream_back;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Assets estáticos con hash: cache agresivo (inmutable) ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- SPA fallback (client-side routing) ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
